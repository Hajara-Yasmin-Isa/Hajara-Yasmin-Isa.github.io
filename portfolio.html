<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio - Hajara-Yasmin Isa</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@400;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: 'Lato', sans-serif;
    }

    body {
      overflow: hidden;
    }

    /* ── Shared header / sidebar / overlay ── */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 200;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #eee;
    }
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      color: #b76e79;
      font-weight: 700;
    }
    .hamburger-menu {
      display: flex;
      flex-direction: column;
      cursor: pointer;
      z-index: 1000;
      gap: 4px;
    }
    .hamburger-menu span {
      width: 25px;
      height: 3px;
      background: linear-gradient(145deg, #b76e79, #d78a8a);
      border-radius: 2px;
    }
    .sidebar {
      position: fixed;
      top: 0;
      right: -250px;
      width: 250px;
      height: 100%;
      background: #fff;
      padding-top: 20px;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease;
      z-index: 1000;
      box-shadow: -2px 0 5px rgba(198,131,131,0.2);
    }
    .sidebar-open { transform: translateX(-250px); }
    .sidebar-content {
      width: 100%;
      display: flex;
      flex-direction: column;
      padding-top: 20px;
    }
    .sidebar-item {
      display: flex;
      align-items: center;
      padding: 15px 20px;
      color: #bbb;
      font-size: 16px;
      text-decoration: none;
      transition: background 0.3s, color 0.3s;
      border-radius: 8px;
    }
    .sidebar-item i { margin-right: 15px; }
    .sidebar-item:hover,
    .sidebar-item.active {
      background: linear-gradient(145deg, #b76e79, #d78a8a, #a15e5e, #d9a4a4);
      color: #fff;
    }
    .sidebar-item.active {
      font-weight: 700;
    }
    .close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: none;
      border: none;
      font-size: 24px;
      color: #333;
      cursor: pointer;
      z-index: 1001;
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      z-index: 500;
    }
    .overlay-visible { display: block; }

    /* ===== MAIN CONTAINER ===== */
    .container {
      position: relative;
      height: 100vh;
      width: 100%;
      background: linear-gradient(120deg, #bc7f7f 50%, white 50%);
      cursor: pointer;
      transition: background 0.3s ease;
      padding-top: 60px; /* offset for fixed header */
    }

    /* ===== CENTER CIRCLE ===== */
    .circle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 200px;
      height: 200px;
      background-color: white;
      border-radius: 50%;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      z-index: 3;
      transition: background-color 0.3s ease;
    }

    /* ===== TEXT ===== */
    .text-left,
    .text-right {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 48px;
      font-weight: bold;
      z-index: 2;
      transition: color 0.3s ease;
      white-space: nowrap;
    }

    .text-left {
      left: 12%;
      color: white;
    }

    .text-right {
      right: 12%;
      color: #bc7f7f;
    }

    /* ===== MOBILE FIXES ===== */
    @media (max-width: 768px) {
  .text-left,
  .text-right {
    font-size: 24px;
    transform: none;
    width: auto;
    white-space: nowrap;
  }

  .text-left {
    left: 10%;
    top: 18%;
  }

  .text-right {
    right: 10%;
    top: 78%;
  }

  .circle {
    width: 140px;
    height: 140px;
  }
}

    /* ===== HINT LABEL ===== */
    .hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      color: rgba(0, 0, 0, 0.4);
      letter-spacing: 0.05em;
      pointer-events: none;
      white-space: nowrap;
      z-index: 4;
    }
  </style>
</head>

<body>

  <!-- Header -->
  <header>
    <div class="logo">YASMIN</div>
    <div class="hamburger-menu" id="hamburger-menu">
      <span></span><span></span><span></span>
    </div>
  </header>

  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <button class="close-btn" id="close-btn">&times;</button>
    <div class="sidebar-content">
      <a href="index.html" class="sidebar-item"><i class="fas fa-home"></i><span>Home</span></a>
      <a href="aboutme.html" class="sidebar-item"><i class="fas fa-user"></i><span>About Me</span></a>
      <a href="portfolio.html" class="sidebar-item active"><i class="fas fa-folder-open"></i><span>Portfolio</span></a>
      <a href="bookshelf.html" class="sidebar-item"><i class="fas fa-book"></i><span>Bookshelf</span></a>
      <a href="contact.html" class="sidebar-item"><i class="fas fa-envelope"></i><span>Contact</span></a>
    </div>
  </nav>
  <div class="overlay" id="overlay"></div>

  <div class="container">
    <div class="text-left">Research</div>
    <div class="text-right">Projects</div>
    <div class="circle"></div>
    <span class="hint" id="hint"></span>
  </div>

  <script>
    const container = document.querySelector('.container');
    const circle = document.querySelector('.circle');
    const textLeft = document.querySelector('.text-left');
    const textRight = document.querySelector('.text-right');
    
    let activeSide = 'research'; // default

    // Set hint text based on device type
    const hint = document.getElementById('hint');
    if (window.matchMedia('(hover: hover)').matches) {
      hint.textContent = 'hover to select \u00b7 click to explore';
    } else {
      hint.textContent = 'tap top for Research \u00b7 tap bottom for Projects';
    }
    
    function activateResearch() {
      activeSide = 'research';
      container.style.background =
        'linear-gradient(120deg, white 50%, #bc7f7f 50%)';
      circle.style.backgroundColor = '#bc7f7f';
      circle.style.color = 'white';
      textLeft.style.color = '#bc7f7f';
      textRight.style.color = 'white';
    }
    
    function activateProjects() {
      activeSide = 'projects';
      container.style.background =
        'linear-gradient(120deg, #bc7f7f 50%, white 50%)';
      circle.style.backgroundColor = 'white';
      circle.style.color = '#bc7f7f';
      textLeft.style.color = 'white';
      textRight.style.color = '#bc7f7f';
    }
    
    /* ===== DESKTOP: HOVER SELECTS ===== */
    if (window.matchMedia('(hover: hover)').matches) {
      container.addEventListener('mousemove', (event) => {
        const midpoint = window.innerWidth / 2;
        if (event.clientX < midpoint) {
          activateResearch();
        } else {
          activateProjects();
        }
      });
    }
    
    /* ===== MOBILE: TAP POSITION SELECTS ===== */
    /* On mobile the layout is top=Research, bottom=Projects, so use Y axis */
    container.addEventListener('touchstart', (event) => {
      const touch = event.touches[0];
      const rect = container.getBoundingClientRect();
      const isMobile = window.innerWidth <= 768;

      if (isMobile) {
        const y = touch.clientY - rect.top;
        const midpoint = rect.height / 2;
        if (y < midpoint) {
          activateResearch();
        } else {
          activateProjects();
        }
      } else {
        const x = touch.clientX - rect.left;
        const midpoint = rect.width / 2;
        if (x < midpoint) {
          activateResearch();
        } else {
          activateProjects();
        }
      }
    });
    
    /* ===== CLICK / TAP CONFIRMS ===== */
    container.addEventListener('click', () => {
      if (activeSide === 'research') {
        window.location.href = 'research.html';
      } else {
        window.location.href = 'projects.html';
      }
    });
    // Sidebar toggle
    const hamburger = document.getElementById('hamburger-menu');
    const sidebar   = document.getElementById('sidebar');
    const closeBtn  = document.getElementById('close-btn');
    const overlay   = document.getElementById('overlay');
    function toggleSidebar() {
      sidebar.classList.toggle('sidebar-open');
      overlay.classList.toggle('overlay-visible');
    }
    hamburger.addEventListener('click', toggleSidebar);
    closeBtn.addEventListener('click', toggleSidebar);
    overlay.addEventListener('click', toggleSidebar);
    </script>

  <footer style="position:fixed;bottom:0;left:0;right:0;text-align:center;padding:10px;background:rgba(255,255,255,0.9);border-top:1px solid #eee;font-family:'Lato',sans-serif;font-size:0.8rem;color:#aaa;z-index:100;">
    &copy; 2026 Hajara-Yasmin Isa. All rights reserved.
  </footer>

</body>
</html>
